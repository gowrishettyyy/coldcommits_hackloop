<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f6f2ea" />
<meta name="ui-revision" content="5 - soft cream, beige accent, larger type" />
<meta name="description" content="Live free seats, ghost seats and queue times for campus canteens and cafes, computed on the camera device. Only counts are stored - never footage." />
<title>CampusPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
</head>
<body data-mode="student">

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">CampusPulse<small>Nitte</small></div>

    <nav class="nav" id="tabbar" aria-label="Sections">
      <button class="tab is-active" data-act="nav" data-screen="home" data-who="student">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.6 12 3l9 7.6"/><path d="M5.6 9.6V20h12.8V9.6"/></svg>
        <span>Home</span>
      </button>
      <button class="tab" data-act="nav" data-screen="map" data-who="student">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m9 4 6 2 5-2v14l-5 2-6-2-5 2V6z"/><path d="M9 4v14M15 6v14"/></svg>
        <span>Map</span>
      </button>
      <button class="tab" data-act="nav" data-screen="alerts" data-who="student">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 6-2 7-2 7h16s-2-1-2-7"/><path d="M10.5 20a2 2 0 0 0 3 0"/></svg>
        <span>Alerts</span><em id="tab-alerts-count"></em>
      </button>
      <button class="tab" data-act="nav" data-screen="insights" data-who="staff">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15v-4M12.5 15V7M17 15v-6"/></svg>
        <span>Staff</span>
      </button>
    </nav>

    <div class="topbar-right">
      <span class="clock" id="campus-clock">08:00</span>
      <span class="pill-source" id="source-pill"><i></i>connecting...</span>
      <div class="seg" id="mode-switch" role="group" aria-label="Who is looking">
        <button class="is-on" data-act="mode" data-mode="student">Student</button>
        <button data-act="mode" data-mode="staff">Staff</button>
      </div>
      <button class="icon-btn" data-act="sheet" title="Demo controls: camera, clock, scenarios" aria-label="Demo controls">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 3v2.4M12 18.6V21M3 12h2.4M18.6 12H21M5.6 5.6l1.7 1.7M16.7 16.7l1.7 1.7M18.4 5.6l-1.7 1.7M7.3 16.7l-1.7 1.7"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="viewport">
  <section class="screen is-active" id="screen-home"><div id="home-body"></div></section>
  <section class="screen" id="screen-map"><div id="map-body"></div></section>
  <section class="screen" id="screen-venue"><div id="venue-body"></div></section>
  <section class="screen" id="screen-alerts"><div id="alerts-body"></div></section>
  <section class="screen" id="screen-insights"><div id="insights-body"></div></section>
</main>

<button class="ask-fab" data-act="chat" aria-label="Ask CampusPulse">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-8.5 8.5c-1.3 0-2.6-.3-3.7-.9L3 21l1.4-5.1A8.5 8.5 0 1 1 21 12z"/></svg>
  <span>Ask</span>
</button>

<div class="chat" id="chat" aria-label="Ask CampusPulse">
  <div class="chat-head">
    <div><b>Ask CampusPulse</b><span>answers from the live campus data</span></div>
    <div class="spacer"></div>
    <button class="icon-btn" data-act="chat-close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="chat-log" id="chat-log"></div>
  <div class="chat-chips" id="chat-chips"></div>
  <form class="chat-form" id="chat-form" onsubmit="return false">
    <input id="chat-input" placeholder="Where should I eat right now?" autocomplete="off" />
    <button type="submit" class="send" aria-label="Send">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 6l6 6-6 6"/></svg>
    </button>
  </form>
</div>

<div class="sheet" id="sheet" aria-hidden="true"><div class="sheet-panel" id="sheet-body"></div></div>
<div class="toasts" id="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
