<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f7a8d2" />
<meta name="ui-revision" content="9 - poster shell, cream sheet on pink" />
<meta name="description" content="Live free seats, ghost seats and queue times for campus canteens and cafes, computed on the camera device. Only counts are stored - never footage." />
<title>Campus Pulse</title>
<!-- Anton, Archivo and Instrument Serif are bundled in web/fonts, so the
     poster type still looks right offline and on machines with no webfonts. -->
<link rel="preload" href="/fonts/anton.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/fonts/archivo.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="/styles.css" />
</head>
<body data-mode="student" data-screen="home">

<div class="shell">

  <div class="topbar">
    <span class="tb-tag">Live seats &middot; no footage</span>
    <span class="tb-status" id="top-status">connecting</span>
  </div>

  <header class="masthead" id="chrome">
    <nav class="mast-nav" aria-label="Sections">
      <button data-act="nav" data-screen="map">Map</button>
      <button data-act="nav" data-screen="alerts">Alerts</button>
      <button data-act="nav" data-screen="insights">Staff</button>
    </nav>
    <button class="brand" data-act="brand" aria-label="Campus Pulse home">
      <span>Campus</span><span class="brand-alt">Pulse</span>
    </button>
    <div class="mast-right">
      <button class="pill" data-act="chat-open">Ask</button>
      <button class="menu-btn" data-act="menu" aria-label="Open menu" aria-expanded="false" id="menu-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="viewport">
    <section class="screen is-active" id="screen-home">
      <div class="hero">
        <div class="hero-row">
          <h1 class="h-big">Find your</h1>
          <span class="hero-pill">free seat</span>
        </div>
        <h1 class="h-big h-big-offset">in seconds</h1>
      </div>
      <div class="home-body" id="home-body"></div>
    </section>

    <section class="screen" id="screen-recommend"><div id="recommend-body"></div></section>
    <section class="screen" id="screen-map"><div id="map-body"></div></section>
    <section class="screen" id="screen-venue"><div id="venue-body"></div></section>
    <section class="screen" id="screen-alerts"><div id="alerts-body"></div></section>
    <section class="screen" id="screen-insights"><div id="insights-body"></div></section>

    <section class="screen" id="screen-admin"><div id="admin-body"></div></section>
  </main>

  <footer class="foot">
    <span>Campus Pulse</span>
    <span>Seat counts only &mdash; frames never leave the camera</span>
  </footer>
</div>

<div class="menu" id="menu" aria-hidden="true">
  <div class="menu-card" role="dialog" aria-label="Everything else">
    <div class="menu-head">
      <b>Campus Pulse</b>
      <button class="icon-btn" data-act="menu-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="seg" id="mode-switch" role="group" aria-label="Who is looking">
      <button class="is-on" data-act="mode" data-mode="student">Student</button>
      <button data-act="mode" data-mode="staff">Staff</button>
    </div>
    <nav class="menu-list" id="menu-list">
      <button data-act="nav" data-screen="home"><span>Home</span></button>
      <button data-act="nav" data-screen="map"><span>Map</span></button>
      <button data-act="nav" data-screen="alerts"><span>Alerts<em class="count" id="tab-alerts-count"></em></span></button>
      <button data-act="nav" data-screen="insights"><span>Staff view</span></button>
      <button data-act="sheet"><span>Demo controls</span></button>
      <button data-act="admin"><span>Admin</span></button>
      <button data-act="chat-open"><span>Ask Campus Pulse</span></button>
    </nav>
    <p class="menu-foot" id="menu-status">Connecting to the engine...</p>
  </div>
</div>

<div class="chat" id="chat" aria-label="Ask CampusPulse" aria-hidden="true">
  <div class="chat-head">
    <b>Ask Campus Pulse</b>
    <div class="spacer"></div>
    <button class="icon-btn" data-act="chat-close" aria-label="Close">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
  <div class="chat-log" id="chat-log"></div>
  <div class="chat-chips" id="chat-chips"></div>
  <form class="chat-form" id="chat-form" onsubmit="return false">
    <input id="chat-input" placeholder="Where should I eat right now?" autocomplete="off" aria-label="Your question" />
    <button type="submit" class="send" aria-label="Send">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M12 6l6 6-6 6"/></svg>
    </button>
  </form>
</div>

<div class="sheet" id="sheet" aria-hidden="true"><div class="sheet-panel" id="sheet-body"></div></div>
<div class="toasts" id="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
